name: splitlens
description: "AI-assisted local receipt scanning and group expense splitting."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
